```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mochila de Estudos</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #1e293b;
    transition: 0.3s;
}

body.dark {
    background: #0f172a;
    color: #f8fafc;
}

/* CABEÇALHO */
header {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    padding: 25px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

header h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

header p {
    opacity: 0.9;
}

.topo {
    max-width: 1100px;
    margin: auto;
}

/* BOTÃO DARK */
.dark-btn {
    margin-top: 15px;
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    cursor: pointer;
    background: white;
    color: #1d4ed8;
    font-weight: bold;
}

/* CONTAINER */
.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

/* FORMULÁRIO */
.formulario {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    margin-bottom: 30px;
}

.dark .formulario,
.dark .atividade {
    background: #1e293b;
}

.formulario h2 {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

textarea {
    min-height: 180px;
    resize: vertical;
}

.dark input,
.dark textarea {
    background: #0f172a;
    color: white;
    border-color: #475569;
}

input:focus,
textarea:focus {
    border-color: #2563eb;
}

/* BOTÕES */
.botoes {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

.salvar {
    background: #2563eb;
    color: white;
}

.limpar {
    background: #64748b;
    color: white;
}

/* PESQUISA */
.pesquisa {
    margin-bottom: 20px;
}

.pesquisa input {
    padding: 14px;
}

/* ATIVIDADES */
.lista {
    display: grid;
    gap: 20px;
}

.atividade {
    background: white;
    padding: 22px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.07);
    border-left: 5px solid #2563eb;
}

.atividade h3 {
    color: #2563eb;
    margin-bottom: 8px;
}

.dark .atividade h3 {
    color: #60a5fa;
}

.info {
    color: #64748b;
    margin-bottom: 15px;
    font-size: 14px;
}

.dark .info {
    color: #cbd5e1;
}

.texto {
    white-space: pre-wrap;
    line-height: 1.6;
    margin-bottom: 18px;
}

.acoes {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.editar {
    background: #f59e0b;
    color: white;
}

.excluir {
    background: #dc2626;
    color: white;
}

/* VAZIO */
.vazio {
    text-align: center;
    padding: 40px;
    color: #64748b;
}

/* RODAPÉ */
footer {
    margin-top: 40px;
    padding: 20px;
    text-align: center;
    background: #1e293b;
    color: white;
}
</style>
</head>

<body>

<header>
    <div class="topo">
        <h1>🎒 Mochila de Estudos</h1>
        <p>Organize suas aulas, atividades e textos em um só lugar.</p>

        <button class="dark-btn" onclick="modoEscuro()">
            🌙 Modo escuro
        </button>
    </div>
</header>

<div class="container">

    <section class="formulario">

        <h2>📝 Nova atividade</h2>

        <label>👤 Nome do aluno</label>
        <input type="text" id="nome" placeholder="Digite seu nome">

        <label>📚 Aula / Matéria</label>
        <input type="text" id="aula" placeholder="Ex: Matemática">

        <label>📌 Título da atividade</label>
        <input type="text" id="titulo" placeholder="Ex: Trabalho sobre funções">

        <label>✍️ Sua atividade ou texto</label>
        <textarea id="texto" placeholder="Digite aqui sua atividade..."></textarea>

        <div class="botoes">
            <button class="salvar" onclick="salvarAtividade()">
                💾 Salvar atividade
            </button>

            <button class="limpar" onclick="limparCampos()">
                🧹 Limpar
            </button>
        </div>

    </section>

    <section>

        <div class="pesquisa">
            <input
                type="text"
                id="pesquisa"
                placeholder="🔎 Pesquisar atividade, aula ou nome..."
                oninput="mostrarAtividades()"
            >
        </div>

        <div id="lista" class="lista"></div>

    </section>

</div>

<footer>
    🎒 Mochila de Estudos • Suas atividades sempre organizadas
</footer>

<script>

let atividades = JSON.parse(localStorage.getItem("atividades")) || [];

let editando = -1;


/* SALVAR */
function salvarAtividade() {

    const nome = document.getElementById("nome").value.trim();
    const aula = document.getElementById("aula").value.trim();
    const titulo = document.getElementById("titulo").value.trim();
    const texto = document.getElementById("texto").value.trim();

    if (!nome || !aula || !titulo || !texto) {
        alert("⚠️ Preencha todos os campos!");
        return;
    }

    const atividade = {
        nome: nome,
        aula: aula,
        titulo: titulo,
        texto: texto,
        data: new Date().toLocaleString("pt-BR")
    };

    if (editando === -1) {

        atividades.push(atividade);

        alert("✅ Atividade salva com sucesso!");

    } else {

        atividades[editando] = atividade;

        alert("✅ Atividade atualizada!");

        editando = -1;
    }

    localStorage.setItem("atividades", JSON.stringify(atividades));

    limparCampos();
    mostrarAtividades();
}


/* MOSTRAR */
function mostrarAtividades() {

    const lista = document.getElementById("lista");
    const pesquisa = document
        .getElementById("pesquisa")
        .value
        .toLowerCase();

    lista.innerHTML = "";

    const filtradas = atividades.filter(item =>
        item.nome.toLowerCase().includes(pesquisa) ||
        item.aula.toLowerCase().includes(pesquisa) ||
        item.titulo.toLowerCase().includes(pesquisa) ||
        item.texto.toLowerCase().includes(pesquisa)
    );

    if (filtradas.length === 0) {

        lista.innerHTML = `
            <div class="vazio">
                <h2>📭 Nenhuma atividade encontrada</h2>
                <p>Salve sua primeira atividade acima.</p>
            </div>
        `;

        return;
    }

    filtradas.forEach((item) => {

        const indice = atividades.indexOf(item);

        const div = document.createElement("div");

        div.className = "atividade";

        div.innerHTML = `
            <h3>📌 ${escaparHTML(item.titulo)}</h3>

            <div class="info">
                👤 ${escaparHTML(item.nome)}
                &nbsp; | &nbsp;
                📚 ${escaparHTML(item.aula)}
                &nbsp; | &nbsp;
                🕒 ${item.data}
            </div>

            <div class="texto">
                ${escaparHTML(item.texto)}
            </div>

            <div class="acoes">

                <button class="editar"
                    onclick="editarAtividade(${indice})">
                    ✏️ Editar
                </button>

                <button class="excluir"
                    onclick="excluirAtividade(${indice})">
                    🗑️ Apagar
                </button>

            </div>
        `;

        lista.appendChild(div);
    });
}


/* EDITAR */
function editarAtividade(indice) {

    const item = atividades[indice];

    document.getElementById("nome").value = item.nome;
    document.getElementById("aula").value = item.aula;
    document.getElementById("titulo").value = item.titulo;
    document.getElementById("texto").value = item.texto;

    editando = indice;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* EXCLUIR */
function excluirAtividade(indice) {

    const confirmar = confirm(
        "Tem certeza que deseja apagar esta atividade?"
    );

    if (!confirmar) return;

    atividades.splice(indice, 1);

    localStorage.setItem(
        "atividades",
        JSON.stringify(atividades)
    );

    mostrarAtividades();
}


/* LIMPAR */
function limparCampos() {

    document.getElementById("nome").value = "";
    document.getElementById("aula").value = "";
    document.getElementById("titulo").value = "";
    document.getElementById("texto").value = "";

    editando = -1;
}


/* MODO ESCURO */
function modoEscuro() {

    document.body.classList.toggle("dark");

    const escuro =
        document.body.classList.contains("dark");

    localStorage.setItem("modoEscuro", escuro);

    document.querySelector(".dark-btn").innerText =
        escuro ? "☀️ Modo claro" : "🌙 Modo escuro";
}


/* PROTEGER TEXTO HTML */
function escaparHTML(texto) {

    return texto
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* RECUPERAR MODO ESCURO */
if (localStorage.getItem("modoEscuro") === "true") {

    document.body.classList.add("dark");

    document.querySelector(".dark-btn").innerText =
        "☀️ Modo claro";
}


/* CARREGAR ATIVIDADES */
mostrarAtividades();

</script>

</body>
</html>
```
